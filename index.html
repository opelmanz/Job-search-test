<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Matcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- VERSION BANNER -->
    <div style="
      background: #222;
      color: #fff;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: 500;
    ">
      Most recent fix = added API debug output panel
    </div>

    <h1>Job Matcher</h1>

    <!-- RESUME -->
    <label for="resume"><strong>Resume</strong></label>
    <textarea id="resume" placeholder="Paste your resume here..."></textarea>

    <!-- SKILLS -->
    <label for="skills"><strong>Skills</strong></label>
    <input id="skills" placeholder="e.g. welding, cad, robotics, python" />

    <!-- LOCATION -->
    <label for="location"><strong>Location (City, State)</strong></label>
    <input id="location" placeholder="e.g. Los Angeles, CA" />

    <!-- DISTANCE -->
    <label for="radius"><strong>Distance (miles)</strong></label>
    <input id="radius" type="number" placeholder="e.g. 25" />

    <!-- RECENCY -->
    <label for="recency"><strong>Posted Within</strong></label>
    <select id="recency">
      <option value="1">Within 24 hours</option>
      <option value="2">Within 48 hours</option>
      <option value="3">Within 72 hours</option>
      <option value="7">Within past 1 week</option>
      <option value="14">Within past 2 weeks</option>
      <option value="21">Within past 3 weeks</option>
      <option value="28">Within past 4 weeks</option>
    </select>

    <!-- SEARCH BUTTON -->
    <button onclick="runSearch()">Find Jobs</button>

    <h2>Results</h2>

    <table id="resultsTable">
      <thead>
        <tr>
          <th>Job Title</th>
          <th>Employer</th>
          <th>Location</th>
          <th>Posted Date</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- DEBUG PANEL -->
    <h2>Debug Output (Raw API Response)</h2>
    <pre id="debugOutput" style="
      background: #111;
      color: #0f0;
      padding: 10px;
      border-radius: 8px;
      overflow: auto;
      max-height: 300px;
      font-size: 12px;
      margin-top: 20px;
    "></pre>

    <!-- CSV EXPORT -->
    <button onclick="downloadCSV()">Download CSV</button>

  </div>

  <script src="app.js"></script>
</body>
</html>
