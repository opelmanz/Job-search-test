<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Matcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Job Matcher</h1>

    <textarea id="resume" placeholder="Paste your resume here..."></textarea>

    <input id="skills" placeholder="Skills (comma separated)" />

    <input id="location" placeholder="City, State" />

    <input id="radius" type="number" placeholder="Distance (miles)" />

    <select id="recency">
      <option value="1">Within 24 hours</option>
      <option value="2">Within 48 hours</option>
      <option value="3">Within 72 hours</option>
      <option value="7">Within past 1 week</option>
      <option value="14">Within past 2 weeks</option>
      <option value="21">Within past 3 weeks</option>
      <option value="28">Within past 4 weeks</option>
    </select>

    <button onclick="runSearch()">Find Jobs</button>

    <h2>Results</h2>

    <table id="resultsTable">
      <thead>
        <tr>
          <th>Job Title</th>
          <th>Employer</th>
          <th>Location</th>
          <th>Posted Date</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button onclick="downloadCSV()">Download CSV</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
