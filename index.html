<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Finder 3000</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <div id="debugBanner" style="
      background:#222;
      color:#fff;
      padding:10px 14px;
      border-radius:8px;
      margin-bottom:15px;
      font-size:14px;
    ">
    </div>

    <h1>Job Matcher 3000</h1>

    <!-- SKILLS -->
    <label><strong>Skills</strong></label>
    <input id="skills" placeholder="e.g. welding, robotics, python, cad" />

    <!-- MUSE CATEGORIES -->
<label><strong>Muse Job Categories</strong></label>
<div style="display:flex; gap:16px; align-items:flex-start;">
  <div style="width:50%;">
    <div id="categoryDropdown" class="category-dropdown">
      <div id="categoryDropdownToggle" class="category-dropdown-toggle" onclick="toggleCategoryDropdown()">
        Select categories ▾
      </div>
      <div id="categoryDropdownList" class="category-dropdown-list" style="display:none;">
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Accounting"> Accounting</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Accounting and Finance"> Accounting and Finance</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Account Management"> Account Management</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Account Management/Customer Success"> Account Management/Customer Success</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Administration and Office"> Administration and Office</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Advertising and Marketing"> Advertising and Marketing</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Animal Care"> Animal Care</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Arts"> Arts</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Business Operations"> Business Operations</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Cleaning and Facilities"> Cleaning and Facilities</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Computer and IT"> Computer and IT</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Construction"> Construction</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Corporate"> Corporate</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Customer Service"> Customer Service</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Data and Analytics"> Data and Analytics</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Data Science"> Data Science</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Design"> Design</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Design and UX"> Design and UX</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Editor"> Editor</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Education"> Education</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Energy Generation and Mining"> Energy Generation and Mining</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Entertainment and Travel Services"> Entertainment and Travel Services</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Farming and Outdoors"> Farming and Outdoors</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Food and Hospitality Services"> Food and Hospitality Services</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Healthcare"> Healthcare</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="HR"> HR</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Human Resources and Recruitment"> Human Resources and Recruitment</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Installation, Maintenance, and Repairs"> Installation, Maintenance, and Repairs</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="IT"> IT</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Law"> Law</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Legal Services"> Legal Services</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Management"> Management</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Manufacturing and Warehouse"> Manufacturing and Warehouse</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Marketing"> Marketing</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Mechanic"> Mechanic</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Media, PR, and Communications"> Media, PR, and Communications</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Mental Health"> Mental Health</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Nurses"> Nurses</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Office Administration"> Office Administration</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Personal Care and Services"> Personal Care and Services</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Physical Assistant"> Physical Assistant</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Product"> Product</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Product Management"> Product Management</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Project Management"> Project Management</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Protective Services"> Protective Services</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Public Relations"> Public Relations</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Real Estate"> Real Estate</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Recruiting"> Recruiting</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Retail"> Retail</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Sales"> Sales</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Science and Engineering"> Science and Engineering</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Social Services"> Social Services</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Software Engineer"> Software Engineer</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Software Engineering"> Software Engineering</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Sports, Fitness, and Recreation"> Sports, Fitness, and Recreation</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Transportation and Logistics"> Transportation and Logistics</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="UX"> UX</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Videography"> Videography</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Writer"> Writer</label>
        <label><input type="checkbox" onchange="updateCategoriesSelected()" value="Writing and Editing"> Writing and Editing</label>
      </div>
    </div>
  </div>
  <div style="width:50%;">
    <div id="categoriesSelected" class="categories-selected-box">
      Failure to select MUSE category may lead to poor search results
    </div>
  </div>
</div>

    <!-- LOCATION -->
    <label><strong>Location (City, State)</strong></label>
    <input id="location" value="Los Angeles, CA" />

    <!-- DISTANCE -->
    <label><strong>Distance (miles)</strong></label>
    <input id="radius" type="number" value="25" />

    <!-- RECENCY -->
    <label><strong>Posted Within</strong></label>
    <select id="recency">
      <option value="1">Within 24 hours</option>
      <option value="2" selected>Within 48 hours</option>
      <option value="3">Within 72 hours</option>
      <option value="7">Within past 1 week</option>
      <option value="14">Within past 2 weeks</option>
      <option value="21">Within past 3 weeks</option>
      <option value="28">Within past 4 weeks</option>
    </select>

    <!-- MINIMUM SALARY -->
<label><strong>Minimum Salary</strong></label>
<select id="minSalary">
  <option value="">No minimum</option>
  <option value="40000">$40,000</option>
  <option value="50000">$50,000</option>
  <option value="60000">$60,000</option>
  <option value="70000">$70,000</option>
  <option value="80000">$80,000</option>
  <option value="90000">$90,000</option>
  <option value="100000">$100,000</option>
  <option value="110000">$110,000</option>
  <option value="120000">$120,000</option>
  <option value="130000">$130,000</option>
  <option value="140000">$140,000</option>
  <option value="150000">$150,000</option>
  <option value="160000">$160,000</option>
  <option value="170000">$170,000</option>
  <option value="180000">$180,000</option>
  <option value="190000">$190,000</option>
  <option value="200000">$200,000</option>
</select>
<br>    
  <!-- API TOGGLES -->
<label><strong>Active APIs</strong></label>
<div>
  <label><input type="checkbox" id="enableAdzuna" checked> Adzuna</label>
  &nbsp;&nbsp;
  <label><input type="checkbox" id="enableMuse" checked> Muse</label>
</div>
    
    <!-- FIND JOBS BUTTON-->
    <button onclick="runSearch()">Find Jobs</button>

    <h2>Results</h2>

    <table id="resultsTable">
      <thead>
        <tr>
          <th>Job Title</th>
          <th>Employer</th>
          <th>Location</th>
          <th>Salary</th>
          <th>Posted</th>
          <th>Link</th>
          <th>Source</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- REQUEST DEBUG -->
    <h3>API Request Preview</h3>
    <pre id="requestPreview" style="
      background:#111;
      color:#0ff;
      padding:10px;
      border-radius:8px;
      font-size:12px;
      max-height:160px;
      overflow:auto;
    "></pre>
    
    <h3>Raw API Response</h3>
    <pre id="debugOutput" style="
      background:#111;
      color:#0f0;
      padding:10px;
      border-radius:8px;
      font-size:12px;
      max-height:300px;
      overflow:auto;
    "></pre>

  </div>

  <script src="app.js"></script>

</body>
</html>
