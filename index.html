<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Matcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- VERSION -->
    <div style="
      background:#222;
      color:white;
      padding:10px 14px;
      border-radius:8px;
      margin-bottom:15px;
      font-size:14px;
    ">
      Most recent fix = fix resume parsing - currently not working 
    </div>

    <h1>Job Matcher</h1>

    <label><strong>Resume</strong></label>
    <textarea id="resume" placeholder="Paste your resume here..."></textarea>

    <label><strong>Skills</strong></label>
    <input id="skills" placeholder="e.g. welding, cad, python" />

    <label><strong>Location (City, State)</strong></label>
    <input id="location" placeholder="e.g. Los Angeles, CA" />

    <label><strong>Distance (miles)</strong></label>
    <input id="radius" type="number" placeholder="e.g. 25" />

    <label><strong>Posted Within</strong></label>
    <select id="recency">
      <option value="1">Within 24 hours</option>
      <option value="2">Within 48 hours</option>
      <option value="3">Within 72 hours</option>
      <option value="7">Within past 1 week</option>
      <option value="14">Within past 2 weeks</option>
      <option value="21">Within past 3 weeks</option>
      <option value="28">Within past 4 weeks</option>
    </select>

    <button onclick="runSearch()">Find Jobs</button>

    <h2>Results</h2>

    <table id="resultsTable">
      <thead>
        <tr>
          <th>Job Title</th>
          <th>Employer</th>
          <th>Location</th>
          <th>Posted</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>Raw API Debug</h2>
    <pre id="debugOutput" style="
      background:#111;
      color:#0f0;
      padding:10px;
      border-radius:8px;
      max-height:300px;
      overflow:auto;
      font-size:12px;
    "></pre>

  </div>

  <script src="app.js"></script>
</body>
</html>
